---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshell-proxy
  labels:
    app.kubernetes.io/name: openshell-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openshell-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openshell-proxy
    spec:
      securityContext:
        runAsNonRoot: true
      serviceAccountName: openshell-proxy
      initContainers: []
      containers:
        - name: openshell-proxy
          image: openshell-proxy:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            # Change this to your OpenShell gRPC gateway address (host:port)
            - name: OSPROXY_GATEWAY_ADDRESS
              value: "hub-cluster-openshell.openshell.svc.cluster.local:8080"

            - name: OSPROXY_GATEWAY_CA_FILE
              value: "/etc/openshell-ca-tls/ca.crt"

            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: SERVICE_ACCOUNT
              valueFrom: { fieldRef: { fieldPath: spec.serviceAccountName } }
          volumeMounts:
            - name: openshell-proxy-config
              mountPath: /etc/openshell-proxy
              readOnly: true
            - name: openshell-ca-tls
              mountPath: /etc/openshell-ca-tls
              readOnly: true
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: openshell-proxy-config
          configMap:
            name: openshell-proxy-config
        - name: openshell-ca-tls
          secret:
            secretName: openshell-ca-tls